<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 30px #00000012;
    }
    h2 { text-align: center; color: #3730a3; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 15px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #3730a3; }
    .switch {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }
    a { color: #4f46e5; cursor: pointer; }
    #message { font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="heading">Create Account</h2>

    <form id="authForm">
      <input id="name" placeholder="Full Name" required>
      <input id="email" type="email" placeholder="Email Address" required>
      <input id="password" type="password"
             placeholder="Password" required minlength="8">
      <button id="submitBtn" type="submit">Register</button>
    </form>

    <p id="message" role="status"></p>

    <div class="switch">
      <span id="switchText">Already have an account?</span>
      <a id="switchBtn">Login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("authForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");

    let isLogin = false;

    document.getElementById("switchBtn").onclick = () => {
      isLogin = !isLogin;
      nameInput.hidden = isLogin;
      nameInput.required = !isLogin;

      document.getElementById("heading").textContent =
        isLogin ? "Welcome Back" : "Create Account";
      document.getElementById("submitBtn").textContent =
        isLogin ? "Login" : "Register";
      document.getElementById("switchText").textContent =
        isLogin ? "New user?" : "Already have an account?";
      document.getElementById("switchBtn").textContent =
        isLogin ? "Register" : "Login";

      message.textContent = "";
    };
     async function checkSession() {
  const token = sessionStorage.getItem("token");
  if (!token) return;
  try {
    const res = await fetch("http://localhost:5001/api/auth/me", {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (res.status === 401) {
      sessionStorage.removeItem("token");
      message.textContent = "Aap kisi aur device pe login ho gaye. Session expire ho gaya.";
    }
  } catch {}
}
setInterval(checkSession, 5000);
    form.onsubmit = async (e) => {
      e.preventDefault();
      message.textContent = "";

      const url = isLogin
        ? "http://localhost:5001/api/auth/login"
        : "http://localhost:5001/api/auth/register";

      const payload = {
        email: emailInput.value,
        password: passwordInput.value,
      };
      if (!isLogin) payload.name = nameInput.value;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Something went wrong");

        sessionStorage.setItem("token", data.token);
        message.style.color = "green";
        message.textContent = isLogin ? "Login successful!" : "Registration successful!";
      } catch (err) {
        message.style.color = "red";
        message.textContent = err.message;
      }
    };
  </script>
</body>
</html>
